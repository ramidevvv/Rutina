<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rutina</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    li { padding: 0.4rem 0; }
    li button { margin-left: 0.5rem; }
    .done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>Mis tareas</h1>

  <form id="task-form">
    <input id="task-title" placeholder="Nueva tarea" required>
    <button type="submit">Añadir</button>
  </form>

  <ul id="task-list"></ul>

  <script>
    // La clave se pide una sola vez y se guarda en el navegador (localStorage)
    let apiKey = localStorage.getItem("apiKey");
    if (!apiKey) {
      apiKey = prompt("Introduce tu clave API");
      localStorage.setItem("apiKey", apiKey);
    }

    // Pide las tareas a la API y las muestra en la lista
    async function loadTasks() {
      const response = await fetch("/tasks", { headers: { "X-API-Key": apiKey } });

      if (response.status === 401) {
        // Clave incorrecta: se borra para que la vuelva a pedir al recargar
        localStorage.removeItem("apiKey");
        alert("Clave API no válida. Recarga la página para volver a intentarlo.");
        return;
      }

      const tasks = await response.json();
      // Primero las pendientes y después las hechas (false va antes que true)
      tasks.sort((a, b) => a.done - b.done);

      const list = document.getElementById("task-list");
      list.innerHTML = "";

      for (const task of tasks) {
        const item = document.createElement("li");

        // Casilla para marcar o desmarcar la tarea como hecha
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => updateTask(task.id, checkbox.checked));
        item.appendChild(checkbox);

        const title = document.createElement("span");
        title.textContent = " " + task.title;
        if (task.done) {
          title.className = "done";
        }
        item.appendChild(title);

        // Botón de borrar solo en las pendientes: las hechas se guardan para estadísticas
        if (!task.done) {
          const button = document.createElement("button");
          button.textContent = "Borrar";
          button.addEventListener("click", () => deleteTask(task.id));
          item.appendChild(button);
        }

        list.appendChild(item);
      }
    }

    // Marca o desmarca una tarea como hecha y recarga la lista
    async function updateTask(id, done) {
      await fetch("/tasks/" + id, {
        method: "PATCH",
        headers: { "X-API-Key": apiKey, "Content-Type": "application/json" },
        body: JSON.stringify({ done: done }),
      });
      loadTasks();
    }

    // Borra una tarea pendiente y recarga la lista
    async function deleteTask(id) {
      await fetch("/tasks/" + id, {
        method: "DELETE",
        headers: { "X-API-Key": apiKey },
      });
      loadTasks();
    }

    // Al enviar el formulario: crea la tarea en la API y recarga la lista
    document.getElementById("task-form").addEventListener("submit", async (event) => {
      event.preventDefault(); // evita que el navegador recargue la página
      const input = document.getElementById("task-title");

      await fetch("/tasks", {
        method: "POST",
        headers: { "X-API-Key": apiKey, "Content-Type": "application/json" },
        body: JSON.stringify({ title: input.value }),
      });

      input.value = "";
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
